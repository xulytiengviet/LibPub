name: Publish LibPub

on:
  push:
    branches: [main]
    paths:
      - "articles/**"
      - "assets/**"
      - "schemas/**"
      - "scripts/**"
      - "templates/**"
      - "tools/xsweet/**"
      - "index.html"
      - "publication.config.json"
      - "requirements.txt"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      slug:
        description: "Article slug to release; leave empty to build only"
        required: false
        type: string
      create_release:
        description: "Create GitHub Release and start Zenodo sync"
        required: true
        default: true
        type: boolean

permissions:
  actions: write
  contents: write
  pages: write
  id-token: write

concurrency:
  group: libpub-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build, release and prepare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install publishing toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc texlive-xetex texlive-fonts-recommended lmodern fonts-dejavu-core
          python -m pip install -r requirements.txt

      - name: Start XSweet when DOCX exists
        shell: bash
        run: |
          if ! find articles -type f -name 'manuscript.docx' -print -quit | grep -q .; then
            echo "No DOCX manuscript; XSweet is not required."
            exit 0
          fi
          if docker build -t libpub-xsweet:local tools/xsweet \
            && docker run --rm -d --name libpub-xsweet -p 127.0.0.1:8081:80 libpub-xsweet:local; then
            for attempt in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:8081/ >/dev/null; then
                echo "LIBPUB_XSWEET_URL=http://127.0.0.1:8081/" >> "$GITHUB_ENV"
                echo "XSweet is ready."
                exit 0
              fi
              sleep 2
            done
            echo "::warning::XSweet did not become ready; Pandoc fallback will be used."
          else
            echo "::warning::XSweet image could not be built; Pandoc fallback will be used."
          fi

      - name: Convert sources and validate JATS
        run: python scripts/prepare_sources.py --write-back

      - name: Preserve generated JATS in repository
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- 'articles/*/article.xml')" ]; then
            echo "No generated XML changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'articles/*/article.xml'
          git commit -m "build: preserve generated JATS XML"
          if ! git push; then
            echo "::warning::Could not preserve generated XML; continuing with the in-run build."
          fi

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build HTML, PDF and machine-readable indexes
        run: python scripts/build.py --output output

      - name: Calculate article release plan
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          MANUAL_SLUG: ${{ inputs.slug }}
        run: |
          python scripts/release_plan.py \
            --before "${BEFORE_SHA:-}" \
            --after "${AFTER_SHA:-HEAD}" \
            --slug "${MANUAL_SLUG:-}" \
            --output .libpub/release-plan.json

      - name: Create versioned GitHub Releases and start Zenodo sync
        if: ${{ github.event_name == 'push' || inputs.create_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(jq 'length' .libpub/release-plan.json)" -eq 0 ]; then
            echo "No article needs a release."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          base_sha="$(git rev-parse HEAD)"
          while IFS= read -r item; do
            slug="$(jq -r '.slug' <<<"$item")"
            tag="$(jq -r '.tag' <<<"$item")"
            version="$(jq -r '.version' <<<"$item")"
            title="$(jq -r '.title' <<<"$item")"
            asset_dir="output/articles/$slug"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag already exists; skipping duplicate release creation."
              continue
            fi
            python scripts/zenodo.py metadata \
              --article "articles/$slug" \
              --repository "$GITHUB_REPOSITORY" \
              --tag "$tag" \
              --output "$asset_dir/zenodo.json"

            archive_dir="$(mktemp -d)"
            git worktree add --detach "$archive_dir" "$base_sha"
            cp "$asset_dir/zenodo.json" "$archive_dir/.zenodo.json"
            (
              cd "$archive_dir"
              git add .zenodo.json
              git commit -m "archive: $slug v$version"
              git tag "$tag"
              git push origin "refs/tags/$tag"
            )
            git worktree remove "$archive_dir"

            assets=(
              "$asset_dir/article.pdf#Full text PDF"
              "$asset_dir/article.xml#JATS XML"
              "$asset_dir/metadata.json#LibPub metadata"
              "$asset_dir/zenodo.json#Zenodo metadata"
            )
            if [ -f "$asset_dir/manuscript.docx" ]; then
              assets+=("$asset_dir/manuscript.docx#Original DOCX")
            fi
            gh release create "$tag" "${assets[@]}" \
              --verify-tag \
              --title "$title (v$version)" \
              --notes "Automated LibPub article release. Zenodo synchronization has been requested."
            gh workflow run zenodo-sync.yml --ref main -f slug="$slug" -f tag="$tag"
          done < <(jq -c '.[]' .libpub/release-plan.json)

      - name: Upload reproducible output
        uses: actions/upload-artifact@v4
        with:
          name: libpub-output-${{ github.sha }}
          path: output/
          retention-days: 30

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: output/

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy publication site
        id: deployment
        uses: actions/deploy-pages@v4
