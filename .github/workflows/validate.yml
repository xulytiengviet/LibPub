name: Validate submission

on:
  pull_request:
    paths:
      - "articles/**"
      - "assets/**"
      - "schemas/**"
      - "scripts/**"
      - "templates/**"
      - "index.html"
      - "publication.config.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc
          python -m pip install -r requirements.txt
      - name: Prepare and validate
        run: python scripts/prepare_sources.py
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Preview build without PDF
        run: python scripts/build.py --output output --skip-pdf
